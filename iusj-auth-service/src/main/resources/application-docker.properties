spring.application.name=iusj-auth-service
spring.datasource.url=jdbc:mysql://mysql:3306/${DB_NAME:bd_tutore}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:tenzo}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.format_sql=true

# Initialisation des données
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

# Port du serveur
server.port=8082

# Configuration Eureka Client
eureka.client.service-url.defaultZone=http://eureka:8761/eureka/
eureka.instance.prefer-ip-address=true
eureka.instance.hostname=auth-service

# Désactiver la vérification de compatibilité Spring Cloud
spring.cloud.compatibility-verifier.enabled=false

# Logging
logging.level.root=INFO
logging.level.com.example.iusj_auth_service=DEBUG
