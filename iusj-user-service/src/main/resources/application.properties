spring.application.name=iusj-user-service
# Configuration de la base de données
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:bd_tutore}
spring.datasource.username=${DB_USERNAME:${DB_USER:root}}
spring.datasource.password=${DB_PASSWORD:${DB_PASS:tenzo}}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# Initialisation des donn\u00e9es
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

# Port du serveur
server.port=8081

# Configuration Eureka Client
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true

# D\u00e9sactiver la v\u00e9rification de compatibilit\u00e9 Spring Cloud si n\u00e9cessaire
spring.cloud.compatibility-verifier.enabled=false