spring.application.name=iusj-resource-service
server.port=8090

spring.datasource.url=jdbc:mysql://mysql:3306/${DB_NAME:bd_tutore}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:tenzo}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

spring.cloud.discovery.enabled=true
eureka.client.service-url.defaultZone=http://eureka:8761/eureka/
eureka.client.enabled=true
eureka.instance.prefer-ip-address=true
eureka.instance.hostname=resource-service

spring.cloud.compatibility-verifier.enabled=false

logging.level.root=INFO
logging.level.com.example.iusj_resource_service=DEBUG
