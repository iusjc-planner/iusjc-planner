spring.application.name=iusj-notification-service

# Configuration de la base de donnees
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:bd_tutore}
spring.datasource.username=${DB_USERNAME:${DB_USER:root}}
spring.datasource.password=${DB_PASSWORD:${DB_PASS:tenzo}}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# Port du serveur
server.port=8092

# Configuration Eureka Client
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true

# Compatibilite Spring Cloud
spring.cloud.compatibility-verifier.enabled=false

# ===== Configuration Email (SMTP) =====
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Adresse expediteur
app.mail.from=${MAIL_FROM:noreply@iusj-planner.cd}
app.mail.enabled=${MAIL_ENABLED:false}

# ===== Configuration SMS (Twilio) =====
app.sms.enabled=${SMS_ENABLED:false}
app.sms.twilio.account-sid=${TWILIO_ACCOUNT_SID:}
app.sms.twilio.auth-token=${TWILIO_AUTH_TOKEN:}
app.sms.twilio.from-number=${TWILIO_FROM_NUMBER:}

# ===== Rappels automatiques =====
app.reminders.enabled=${REMINDERS_ENABLED:true}
app.reminders.schedule-service-url=http://iusj-schedule-service
app.reminders.user-service-url=http://iusj-user-service
