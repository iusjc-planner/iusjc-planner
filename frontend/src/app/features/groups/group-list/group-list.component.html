<div class="page-header">
	<h3 class="page-title"><i class="mdi mdi-account-group"></i> Groupes</h3>
	<nav aria-label="breadcrumb">
		<ol class="breadcrumb">
			<li class="breadcrumb-item"><a routerLink="/app/dashboard">Accueil</a></li>
			<li class="breadcrumb-item active" aria-current="page">Groupes</li>
		</ol>
	</nav>
</div>

<div class="row">
	<div class="col-lg-12 grid-margin stretch-card">
		<div class="card">
			<div class="card-body">
				<div class="d-flex justify-content-between align-items-center mb-4">
					<h4 class="card-title mb-0">Liste des groupes</h4>
					<a class="btn btn-primary btn-sm" routerLink="/app/groups/new"><i class="mdi mdi-plus"></i> Ajouter</a>
				</div>

				<div class="row mb-3">
					<div class="col-md-4">
						<label class="form-label">Recherche</label>
						<input class="form-control" [(ngModel)]="search" (input)="applyFilters()" placeholder="Nom du groupe">
					</div>
					<div class="col-md-3">
						<label class="form-label">Niveau</label>
						<input class="form-control" [(ngModel)]="levelFilter" (input)="applyFilters()" placeholder="Ex: L1, L2">
					</div>
					<div class="col-md-3">
						<label class="form-label">Statut</label>
						<select class="form-control" [(ngModel)]="statusFilter" (change)="applyFilters()">
							<option value="">Tous</option>
							<option value="ACTIVE">Actif</option>
							<option value="INACTIVE">Inactif</option>
						</select>
					</div>
					<div class="col-md-2 d-flex align-items-end">
						<button class="btn btn-outline-secondary w-100" (click)="reset()"><i class="mdi mdi-refresh"></i> Réinitialiser</button>
					</div>
				</div>

				<div *ngIf="errorMessage" class="alert alert-danger">{{ errorMessage }}</div>
				<div *ngIf="loading" class="text-center py-4">
					<div class="spinner-border text-primary" role="status"><span class="sr-only">Chargement...</span></div>
				</div>

				<div class="table-responsive" *ngIf="!loading">
					<table class="table table-hover">
						<thead>
							<tr>
								<th>Nom</th>
								<th>Niveau</th>
								<th>École</th>
								<th>Taille</th>
								<th>Statut</th>
								<th class="text-right">Actions</th>
							</tr>
						</thead>
						<tbody>
							<tr *ngFor="let g of filtered">
								<td>{{ g.name }}</td>
								<td>{{ g.level || '—' }}</td>
								<td>{{ g.schoolId }}</td>
								<td>{{ g.size || '—' }}</td>
								<td>
									<span class="badge" [ngClass]="g.status === 'ACTIVE' ? 'badge-success' : 'badge-secondary'">{{ g.status || 'N/A' }}</span>
								</td>
								<td class="text-right">
									<div class="btn-group btn-group-sm" role="group">
										<a class="btn btn-outline-warning" [routerLink]="['/app/groups', g.id, 'edit']"><i class="mdi mdi-pencil"></i></a>
										<button class="btn btn-outline-danger" (click)="delete(g.id!)"><i class="mdi mdi-delete"></i></button>
									</div>
								</td>
							</tr>
							<tr *ngIf="filtered.length === 0">
								<td colspan="6" class="text-center text-muted">Aucun groupe</td>
							</tr>
						</tbody>
					</table>
				</div>
			</div>
		</div>
	</div>
</div>
