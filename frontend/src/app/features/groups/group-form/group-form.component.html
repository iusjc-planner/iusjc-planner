<div class="page-header">
	<h3 class="page-title"><i class="mdi mdi-account-group"></i> {{ isEdit ? 'Modifier un groupe' : 'Nouveau groupe' }}</h3>
	<nav aria-label="breadcrumb">
		<ol class="breadcrumb">
			<li class="breadcrumb-item"><a routerLink="/app/dashboard">Accueil</a></li>
			<li class="breadcrumb-item"><a routerLink="/app/groups">Groupes</a></li>
			<li class="breadcrumb-item active" aria-current="page">{{ isEdit ? 'Modifier' : 'Créer' }}</li>
		</ol>
	</nav>
</div>

<div class="row">
	<div class="col-lg-8 grid-margin stretch-card">
		<div class="card">
			<div class="card-body">
				<h4 class="card-title">{{ isEdit ? 'Modifier le groupe' : 'Créer un groupe' }}</h4>
				<form (ngSubmit)="submit()" #groupForm="ngForm">
					<div class="form-group">
						<label>Nom *</label>
						<input class="form-control" name="name" [(ngModel)]="group.name" required placeholder="Ex: L1-INFO-A">
					</div>
					<div class="form-group">
						<label>Niveau</label>
						<input class="form-control" name="level" [(ngModel)]="group.level" placeholder="Ex: L1, M1, Terminale">
					</div>
					<div class="form-group">
						<label>ID École *</label>
						<input type="number" class="form-control" name="schoolId" [(ngModel)]="group.schoolId" required placeholder="ID de l'école">
						<small class="text-muted">(sélecteur à brancher lorsque l'API écoles est consommée côté liste)</small>
					</div>
					<div class="form-group">
						<label>Taille</label>
						<input type="number" class="form-control" name="size" [(ngModel)]="group.size" placeholder="Nombre d'étudiants">
					</div>
					<div class="form-group">
						<label>Statut</label>
						<select class="form-control" name="status" [(ngModel)]="group.status">
							<option value="ACTIVE">Actif</option>
							<option value="INACTIVE">Inactif</option>
						</select>
					</div>
					<div class="d-flex gap-2 mt-3">
						<button type="submit" class="btn btn-primary" [disabled]="loading || !groupForm.form.valid">
							<i class="mdi mdi-content-save"></i> {{ isEdit ? 'Mettre à jour' : 'Créer' }}
						</button>
						<button type="button" class="btn btn-secondary" (click)="cancel()">
							<i class="mdi mdi-cancel"></i> Annuler
						</button>
					</div>
				</form>
			</div>
		</div>
	</div>
</div>
