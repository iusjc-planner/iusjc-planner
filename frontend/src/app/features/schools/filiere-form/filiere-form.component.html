<div class="page-header">
  <h3 class="page-title">
    <i class="mdi mdi-school menu-icon"></i>
    {{ isEditMode ? 'Modifier' : 'Ajouter' }} une filière
  </h3>
</div>

<div class="row">
  <div class="col-lg-8 grid-margin stretch-card">
    <div class="card">
      <div class="card-body">
        <form [formGroup]="form" (ngSubmit)="onSubmit()">
          <div class="form-group">
            <label>Code *</label>
            <input type="text" class="form-control" formControlName="code" [class.is-invalid]="form.get('code')?.invalid && form.get('code')?.touched" placeholder="ex: INFO">
          </div>

          <div class="form-group">
            <label>Nom *</label>
            <input type="text" class="form-control" formControlName="nom" [class.is-invalid]="form.get('nom')?.invalid && form.get('nom')?.touched" placeholder="Nom de la filière">
          </div>

          <div class="form-group">
            <label>Description</label>
            <textarea class="form-control" formControlName="description" rows="4" placeholder="Description de la filière"></textarea>
          </div>

          <div class="form-group">
            <label>Statut *</label>
            <select class="form-control" formControlName="status">
              <option value="ACTIVE">Actif</option>
              <option value="INACTIVE">Inactif</option>
            </select>
          </div>

          <div class="form-group">
            <button type="submit" class="btn btn-primary" [disabled]="!form.valid || loading">
              <i class="mdi mdi-content-save"></i> Enregistrer
            </button>
            <button type="button" class="btn btn-outline-secondary ml-2" (click)="onCancel()">
              <i class="mdi mdi-close"></i> Annuler
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
