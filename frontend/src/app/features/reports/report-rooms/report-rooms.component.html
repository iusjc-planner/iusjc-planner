<div class="page-header">
  <h3 class="page-title">Rapport occupation salles</h3>
  <nav aria-label="breadcrumb">
    <ol class="breadcrumb">
      <li class="breadcrumb-item"><a routerLink="/app/reports">Rapports</a></li>
      <li class="breadcrumb-item active" aria-current="page">Occupation salles</li>
    </ol>
  </nav>
</div>

<div class="card">
  <div class="card-body">
    <div class="row g-2 mb-3">
      <div class="col-md-3">
        <label class="form-label">Date debut</label>
        <input class="form-control" type="date" [(ngModel)]="from">
      </div>
      <div class="col-md-3">
        <label class="form-label">Date fin</label>
        <input class="form-control" type="date" [(ngModel)]="to">
      </div>
      <div class="col-md-3">
        <label class="form-label">Salle ID (optionnel)</label>
        <input class="form-control" type="number" [(ngModel)]="salleId">
      </div>
      <div class="col-md-3">
        <label class="form-label">Format</label>
        <select class="form-select" [(ngModel)]="format">
          <option value="PDF">PDF</option>
          <option value="EXCEL">EXCEL</option>
        </select>
      </div>
    </div>

    <button class="btn btn-primary me-2" [disabled]="generating" (click)="generate()">
      Lancer generation
    </button>
    <button class="btn btn-outline-primary" [disabled]="!latestReport || latestReport.status !== 'TERMINE'" (click)="download()">
      Telecharger export
    </button>
  </div>
</div>
