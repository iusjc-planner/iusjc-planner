<div class="container-fluid py-4">
  <!-- Header -->
  <div class="d-flex justify-content-between align-items-center mb-4">
    <div>
      <h2 class="mb-1">
        <i class="mdi mdi-calendar-edit me-2"></i>
        {{ isEditMode ? 'Modifier la Séance' : 'Nouvelle Séance' }}
      </h2>
      <nav aria-label="breadcrumb">
        <ol class="breadcrumb mb-0">
          <li class="breadcrumb-item"><a routerLink="/app/courses">Séances</a></li>
          <li class="breadcrumb-item active">{{ isEditMode ? 'Modifier' : 'Nouvelle' }}</li>
        </ol>
      </nav>
    </div>
  </div>

  <!-- Loading -->
  <div *ngIf="loading" class="text-center py-5">
    <div class="spinner-border text-primary" role="status">
      <span class="visually-hidden">Chargement...</span>
    </div>
  </div>

  <!-- Error -->
  <div *ngIf="error" class="alert alert-danger">
    <i class="mdi mdi-alert-circle me-2"></i>{{ error }}
  </div>

  <!-- Form -->
  <div class="card" *ngIf="!loading">
    <div class="card-body">
      <form [formGroup]="form" (ngSubmit)="onSubmit()">
        <div class="row">
          <!-- Matière -->
          <div class="col-md-6 mb-3">
            <label for="matiereId" class="form-label">Matière <span class="text-danger">*</span></label>
            <select class="form-select" id="matiereId" formControlName="matiereId"
              [class.is-invalid]="f['matiereId'].touched && f['matiereId'].invalid"
              (change)="onMatiereChange()">
              <option [ngValue]="null">-- Sélectionner une matière --</option>
              <option *ngFor="let m of matieres" [ngValue]="m.id">{{ m.code }} - {{ m.nom }}</option>
            </select>
            <div class="invalid-feedback">Matière requise</div>
            <div class="form-text">
              <a routerLink="/app/matieres/new" class="text-primary">
                <i class="mdi mdi-plus me-1"></i>Créer une nouvelle matière
              </a>
            </div>
          </div>

          <!-- Type -->
          <div class="col-md-3 mb-3">
            <label for="type" class="form-label">Type <span class="text-danger">*</span></label>
            <select class="form-select" id="type" formControlName="type">
              <option [value]="CourseType.CM">Cours Magistral (CM)</option>
              <option [value]="CourseType.TD">Travaux Dirigés (TD)</option>
              <option [value]="CourseType.TP">Travaux Pratiques (TP)</option>
              <option [value]="CourseType.EXAM">Examen</option>
            </select>
          </div>

          <!-- Statut -->
          <div class="col-md-3 mb-3">
            <label for="status" class="form-label">Statut <span class="text-danger">*</span></label>
            <select class="form-select" id="status" formControlName="status">
              <option [value]="CourseStatus.SCHEDULED">Programmée</option>
              <option [value]="CourseStatus.COMPLETED">Terminée</option>
              <option [value]="CourseStatus.CANCELLED">Annulée</option>
              <option [value]="CourseStatus.POSTPONED">Reportée</option>
            </select>
          </div>

          <!-- Date -->
          <div class="col-md-4 mb-3">
            <label for="date" class="form-label">Date <span class="text-danger">*</span></label>
            <input type="date" class="form-control" id="date" formControlName="date"
              [class.is-invalid]="f['date'].touched && f['date'].invalid">
            <div class="invalid-feedback">Date requise</div>
          </div>

          <!-- Heure début -->
          <div class="col-md-4 mb-3">
            <label for="startTime" class="form-label">Heure début <span class="text-danger">*</span></label>
            <input type="time" class="form-control" id="startTime" formControlName="startTime"
              [class.is-invalid]="f['startTime'].touched && f['startTime'].invalid">
            <div class="invalid-feedback">Heure de début requise</div>
          </div>

          <!-- Heure fin -->
          <div class="col-md-4 mb-3">
            <label for="endTime" class="form-label">Heure fin <span class="text-danger">*</span></label>
            <input type="time" class="form-control" id="endTime" formControlName="endTime"
              [class.is-invalid]="f['endTime'].touched && f['endTime'].invalid">
            <div class="invalid-feedback">Heure de fin requise</div>
          </div>

          <!-- Salle -->
          <div class="col-md-4 mb-3">
            <label for="roomId" class="form-label">Salle</label>
            <select class="form-select" id="roomId" formControlName="roomId">
              <option [ngValue]="null">-- Aucune --</option>
              <option *ngFor="let r of rooms" [ngValue]="r.id">{{ r.name }} ({{ r.capacity }} places)</option>
            </select>
          </div>

          <!-- Groupe -->
          <div class="col-md-4 mb-3">
            <label for="groupId" class="form-label">Groupe</label>
            <select class="form-select" id="groupId" formControlName="groupId">
              <option [ngValue]="null">-- Tous les groupes --</option>
              <option *ngFor="let g of groups" [ngValue]="g.id">{{ g.name }}</option>
            </select>
          </div>

          <!-- Enseignant -->
          <div class="col-md-4 mb-3">
            <label for="teacherId" class="form-label">Enseignant</label>
            <select class="form-select" id="teacherId" formControlName="teacherId">
              <option [ngValue]="null">-- Aucun --</option>
              <option *ngFor="let t of teachers" [ngValue]="t.id">{{ t.prenom }} {{ t.nom }}</option>
            </select>
            <div class="form-text" *ngIf="form.get('matiereId')?.value">
              Rempli automatiquement depuis la matière
            </div>
          </div>

          <!-- Notes -->
          <div class="col-12 mb-3">
            <label for="notes" class="form-label">Notes</label>
            <textarea class="form-control" id="notes" formControlName="notes" rows="3"
              placeholder="Informations complémentaires sur la séance..."></textarea>
          </div>
        </div>

        <hr>

        <!-- Actions -->
        <div class="d-flex gap-2">
          <button type="submit" class="btn btn-primary" [disabled]="saving">
            <span *ngIf="saving" class="spinner-border spinner-border-sm me-1"></span>
            <i *ngIf="!saving" class="mdi mdi-content-save me-1"></i>
            {{ isEditMode ? 'Mettre à jour' : 'Créer' }}
          </button>
          <button type="button" class="btn btn-outline-secondary" (click)="onCancel()">
            <i class="mdi mdi-close me-1"></i>Annuler
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
