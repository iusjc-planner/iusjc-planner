<div class="page-header">
  <h3 class="page-title">
    <i class="mdi mdi-account menu-icon"></i>
    {{ isEditMode ? 'Modifier' : 'Ajouter' }} un étudiant
  </h3>
</div>

<div class="row">
  <div class="col-lg-8 grid-margin stretch-card">
    <div class="card">
      <div class="card-body">
        <form [formGroup]="form" (ngSubmit)="onSubmit()">
          <div class="form-group">
            <label>Matricule *</label>
            <input type="text" class="form-control" formControlName="matricule" [class.is-invalid]="form.get('matricule')?.invalid && form.get('matricule')?.touched" placeholder="ex: STU001">
          </div>

          <div class="form-row">
            <div class="form-group col-md-6">
              <label>Nom *</label>
              <input type="text" class="form-control" formControlName="nom" [class.is-invalid]="form.get('nom')?.invalid && form.get('nom')?.touched" placeholder="Nom de l'étudiant">
            </div>
            <div class="form-group col-md-6">
              <label>Prénom *</label>
              <input type="text" class="form-control" formControlName="prenom" [class.is-invalid]="form.get('prenom')?.invalid && form.get('prenom')?.touched" placeholder="Prénom de l'étudiant">
            </div>
          </div>

          <div class="form-row">
            <div class="form-group col-md-6">
              <label>Email</label>
              <input type="email" class="form-control" formControlName="email" placeholder="email@example.com">
            </div>
            <div class="form-group col-md-6">
              <label>Téléphone</label>
              <input type="tel" class="form-control" formControlName="telephone" placeholder="+237 6XX XXX XXX">
            </div>
          </div>

          <div class="form-group">
            <label>Statut *</label>
            <select class="form-control" formControlName="status">
              <option value="ACTIVE">Actif</option>
              <option value="INACTIVE">Inactif</option>
              <option value="SUSPENDED">Suspendu</option>
            </select>
          </div>

          <div class="form-group">
            <button type="submit" class="btn btn-primary" [disabled]="!form.valid || loading">
              <i class="mdi mdi-content-save"></i> Enregistrer
            </button>
            <button type="button" class="btn btn-outline-secondary ml-2" (click)="onCancel()">
              <i class="mdi mdi-close"></i> Annuler
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
