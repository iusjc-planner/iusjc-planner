      dockerfile: Dockerfile
    container_name: iusj-frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - gateway
    environment:
      - API_URL=http://gateway:8080
    networks:
      - iusj-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

# ============================================
# VOLUMES
# ============================================
volumes:
  mysql_data:
    driver: local

# ============================================
# NETWORKS
# ============================================
networks:
  iusj-network:
    driver: bridge
