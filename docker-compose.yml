      dockerfile: Dockerfile
    container_name: iusj-frontend
    ports:
      - "${FRONTEND_PORT}:80"
    depends_on:
      - gateway
    environment:
      - API_URL=http://gateway:8080
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/health"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - iusj-network

# ============================================
# VOLUMES
# ============================================
volumes:
  mysql_data:
    driver: local

# ============================================
# NETWORKS
# ============================================
networks:
  iusj-network:
    driver: bridge
